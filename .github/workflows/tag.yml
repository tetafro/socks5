name: Release a tag
on:
  push:
    tags: ['*']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Run linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6
  build:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: tetafro
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: >
            ghcr.io/tetafro/socks5:latest,
            ghcr.io/tetafro/socks5:${{ github.ref_name }}
